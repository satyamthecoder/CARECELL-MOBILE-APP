name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ['backend/**']
  pull_request:
    branches: [main, develop]
    paths: ['backend/**']

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        # Tests use Testcontainers (real MongoDB via Docker). GitHub-hosted
        # ubuntu-latest runners have Docker pre-installed and running by
        # default, so no extra setup step is needed here.
        run: mvn -B test

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: carecell-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  docker-build:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t carecell-backend:${{ github.sha }} ./backend

      # TODO: Add steps to push to your container registry (ECR, Docker Hub, etc.)
      # and deploy to your hosting platform (AWS ECS, Railway, Render, etc.)
