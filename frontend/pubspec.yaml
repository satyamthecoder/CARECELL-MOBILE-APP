name: carecell
description: CareCell — AI-Powered Healthcare Assistance Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.4

  # ── Navigation ────────────────────────────────
  go_router: ^13.2.0

  # ── Network ───────────────────────────────────
  dio: ^5.4.1
  retrofit: ^4.1.0

  # ── Secure Storage ────────────────────────────
  flutter_secure_storage: ^9.0.0

  # ── Google Maps ───────────────────────────────
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # ── QR Code ───────────────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6

  # ── File Handling ─────────────────────────────
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  open_filex: ^4.3.4

  # ── UI ────────────────────────────────────────
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  pinput: ^3.0.1              # OTP input
  fl_chart: ^0.67.0           # Charts

  # ── Local Notifications ───────────────────────
  flutter_local_notifications: ^17.0.0
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

  # ── Utilities ────────────────────────────────
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.0.1
  url_launcher: ^6.2.5
  permission_handler: ^11.3.0
  package_info_plus: ^5.0.1
  logger: ^2.1.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  retrofit_generator: ^8.1.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

 
